anger{background:white;color:#c0392b;border:1px solid #e0c6c2}.small{padding:7px 10px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info{background:#f3f7f8;border-radius:13px;padding:12px}.expense{font-size:23px;font-weight:800}.fab{position:fixed;right:18px;bottom:22px;width:58px;height:58px;border-radius:50%;font-size:26px;box-shadow:0 5px 18px #0003}@media(min-width:700px){.content{padding:25px 0}}
</style><style>
.searchrow{display:flex;gap:6px;margin-top:14px}.searchrow input{flex:1;padding:10px;border:1px solid #d6e0e3;border-radius:10px}.filterline{display:flex;align-items:center;gap:7px;margin-top:10px}.filterline input{padding:8px;border:1px solid #d6e0e3;border-radius:10px}.entry{border-top:1px solid #edf1f2;padding:15px 0}.entry:first-child{border-top:0}.dayRow{display:grid;grid-template-columns:60px 75px 1fr;gap:8px;align-items:center;padding:12px 8px;border-top:1px solid #edf1f2;cursor:pointer}.dayRow.current{background:#eaf7f6;border-radius:10px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}.price{font-size:18px;font-weight:800;margin-top:6px}.catGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.heroCard{background:linear-gradient(145deg,#fff,#edf9f8)}select{width:100%;padding:11px;border:1px solid #d6e0e3;border-radius:12px;background:white}.photoWrap{position:relative}.photoWrap .mini{position:absolute;right:3px;top:3px;padding:3px 8px;border-radius:99px}.lightbox{position:fixed;inset:0;background:#000d;z-index:20;display:flex;align-items:center;justify-content:center;padding:15px}.lightbox img{max-width:100%;max-height:90vh;object-fit:contain}.lightbox button{position:absolute;right:18px;top:18px;border-radius:50%;font-size:24px;width:45px;height:45px;padding:0}.editOld{margin-top:10px}
@media(max-width:420px){.dayRow{grid-template-columns:52px 70px 1fr}.catGrid{grid-template-columns:1fr}.searchrow{flex-wrap:wrap}.searchrow input{min-width:100%}}
.photoNav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;padding:0;font-size:22px}.photoPrev{left:12px}.photoNext{right:12px}</style></head><body>
<header><div class="wrap"><h1>🌺 Hawaii 2026</h1><div style="font-size:11px;opacity:.8;margin-top:3px">Build 2026-10-01.3</div><p>Oahu · 2026/10/1 — 10/5 · 2人</p><div class="stats"><div class="stat"><b id="day">DAY 1</b><span>旅行日</span></div><div class="stat"><b id="entries">0</b><span>日記</span></div><div class="stat"><b id="photos">0</b><span>写真</span></div></div></div></header>
<nav class="nav" id="nav"><button data-tab="home" class="active">🏝️ ホーム</button><button data-tab="diary">✍️ 日記</button><button data-tab="timeline">🕐 時系列</button><button data-tab="schedule">📅 予定</button><button data-tab="photos">📷 写真</button><button data-tab="food">🍴 食事</button><button data-tab="places">📍 場所</button><button data-tab="money">💵 支出</button><button data-tab="info">✈️ 旅行情報</button></nav>
<main class="wrap content" id="app"></main><button class="fab" id="fab">＋</button>
<script>
const KEY="hawaiiDiaryV2";
const START="2026-10-01", END="2026-10-05";
let tab="home", filter="", diaryFilterDate="";
const blank={diary:[],photos:[],food:[],places:[],money:[],schedule:[],tripInfo:{start:START,end:END,people:"2人",area:"Oahu / Waikiki",hotel:"The Ambassador Hotel of Waikiki",notes:["10/1 Hula Grill — 予約済み","10/3 ディナー — 記録予定"]}};
let data=loadData();

function loadData(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw)return normalize(JSON.parse(raw));
    const old=localStorage.getItem("hawaiiDiaryV1");
    if(old)return normalize(JSON.parse(old));
  }catch(e){}
  return structuredClone(blank);
}
function normalize(d){
  d=Object.assign(structuredClone(blank),d||{});
  d.diary=Array.isArray(d.diary)?d.diary:[];
  d.photos=Array.isArray(d.photos)?d.photos:[];
  d.food=Array.isArray(d.food)?d.food:[];
  d.places=Array.isArray(d.places)?d.places:[];
  d.money=Array.isArray(d.money)?d.money:[];d.schedule=Array.isArray(d.schedule)?d.schedule:[];
  d.tripInfo=Object.assign(structuredClone(blank.tripInfo),d.tripInfo||{});
  d.diary.forEach(x=>{if(!x.id)x.id=(crypto.randomUUID?crypto.randomUUID():"d"+Date.now()+Math.random().toString(36).slice(2));x.photos=Array.isArray(x.photos)?x.photos:[]});
  d.photos=d.photos.filter(x=>x&&x.src).map(x=>Object.assign({},x,{diaryId:x.diaryId||null}));
  const linked=new Set();d.diary.forEach(x=>x.photos.forEach(src=>linked.add(src)));
  d.photos=d.photos.filter(x=>x.diaryId===null||linked.has(x.src));
  d.diary.forEach(x=>x.photos.forEach(src=>{if(!d.photos.some(p=>p.src===src))d.photos.push({src,date:x.date,diaryId:x.id})}));
  d.photos.forEach(p=>{const owner=d.diary.find(x=>x.id===p.diaryId);if(owner)p.date=owner.date});
  return d;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function dateKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function today(){return dateKey(new Date())}
function fmt(d){if(!d)return"";return new Date(d+"T00:00:00").toLocaleDateString("ja-JP",{month:"numeric",day:"numeric",weekday:"short"})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));render()}catch(e){alert("保存容量を超えました。写真を減らすか、バックアップを書き出してください。")}}
function dayNo(d=today()){const x=Math.floor((new Date(d+"T00:00:00")-new Date(START+"T00:00:00"))/86400000)+1;return Math.max(1,Math.min(5,x))}
function allPhotos(){return data.photos}
function stats(){
  const e=document.getElementById("entries"),p=document.getElementById("photos"),day=document.getElementById("day");
  if(e)e.textContent=data.diary.length;
  if(p)p.textContent=allPhotos().length;
  if(day)day.textContent="DAY "+dayNo();
}
function render(){
  stats();
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  let h="";
  if(tab==="home")h=home();
  else if(tab==="diary")h=diary();
  else if(tab==="timeline")h=timeline();else if(tab==="schedule")h=schedule();
  else if(tab==="photos")h=photos();
  else if(tab==="food")h=food();
  else if(tab==="places")h=places();
  else if(tab==="money")h=money();
  else h=info();
  document.getElementById("app").innerHTML=h;
}
function searchBox(placeholder="検索…"){
  return '<div class="searchrow"><input id="searchInput" value="'+esc(filter)+'" placeholder="'+placeholder+'"><button class="small" onclick="filter=document.getElementById(\'searchInput\').value;render()">検索</button><button class="danger small" onclick="filter=\'\';render()">クリア</button></div>';
}
function home(){
  const recent=data.diary.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).slice(0,3);
  const total=data.money.reduce((s,x)=>s+Number(x.amount||0),0);
  const todayDiary=data.diary.filter(x=>x.date===today()).length;
  const todaySpend=data.money.filter(x=>x.date===today()).reduce((s,x)=>s+Number(x.amount||0),0);
  const dayEntries=data.diary.filter(x=>x.date===today()).length;
  return '<div class="card heroCard"><div class="hero">Aloha! 🌺</div><p>今日の思い出を、写真と一緒に残そう。</p><div class="grid"><div class="info"><b>📅 DAY '+dayNo()+'</b><br><span class="muted">'+fmt(today())+'</span></div><div class="info"><b>📝 今日の日記</b><br><span class="muted">'+todayDiary+'件</span></div><div class="info"><b>💵 今日の支出</b><br><span class="muted">'+todaySpend.toFixed(2)+'</span></div><div class="info"><b>💰 旅行支出</b><br><span class="muted">'+total.toFixed(2)+'</span></div></div></div>'+
  '<div class="card"><div class="row between"><div class="hero">📅 旅行スケジュール</div><span class="tag">10/1〜10/5</span></div>'+[1,2,3,4,5].map(n=>{const d=new Date("2026-10-01T00:00:00");d.setDate(d.getDate()+n-1);const ds=dateKey(d),cnt=data.diary.filter(x=>x.date===ds).length;return '<div class="dayRow '+(ds===today()?'current':'')+'" onclick="tab=\'diary\';diaryFilterDate=\''+ds+'\';render()"><b>DAY '+n+'</b><span>'+fmt(ds)+'</span><span class="muted">'+cnt+'件の記録</span></div>'}).join("")+'</div>'+
  '<div class="card"><div class="row between"><b>最近の日記</b><button class="small" onclick="newDiary()">＋追加</button></div>'+(recent.length?recent.map(x=>diaryCard(x,false)).join(""):'<div class="empty">まだ日記がありません。</div>')+'</div>'+
  '<div class="card"><b>📌 旅行メモ</b><p class="muted">🏨 The Ambassador Hotel of Waikiki<br>🍴 10/1 Hula Grill — 予約済み<br>🍴 10/3 ディナー — 記録予定</p></div>';
}
function diaryCard(x,actions=true){
  const i=data.diary.indexOf(x);
  return '<div class="entry"><div class="row between"><div><b>'+esc(x.title||"無題")+'</b><div class="muted">'+fmt(x.date)+(x.time?" "+esc(x.time):"")+'</div></div>'+(actions?'<div class="row"><button class="small" onclick="editDiary('+i+')">編集</button><button class="danger small" onclick="delItem(\'diary\','+i+')">削除</button></div>':"")+'</div><p>'+esc(x.body||"").replace(/\\n/g,"<br>")+'</p>'+((x.tags||[]).map(t=>'<span class="tag">#'+esc(t)+'</span>').join(""))+(x.photos?.length?'<div class="thumbs">'+x.photos.map((p,j)=>'<img src="'+p+'" onclick="openPhotoSrc(\''+p+'\')" alt="photo">').join("")+'</div>':"")+'</div>';
}
function diary(){
  let a=data.diary.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  if(filter)a=a.filter(x=>(x.title+" "+x.body+" "+(x.tags||[]).join(" ")).toLowerCase().includes(filter.toLowerCase()));
  if(diaryFilterDate)a=a.filter(x=>x.date===diaryFilterDate);
  return '<div class="card"><div class="row between"><div class="hero">✍️ 日記</div><button onclick="newDiary()">＋追加</button></div>'+searchBox("タイトル・本文・タグを検索")+'<div class="filterline"><label>日付</label><input type="date" value="'+esc(diaryFilterDate)+'" onchange="diaryFilterDate=this.value;render()"><button class="danger small" onclick="diaryFilterDate=\'\';render()">全日</button></div></div>'+(a.length?a.map(x=>diaryCard(x,true)).join(""):'<div class="empty">条件に一致する日記がありません。</div>');
}
function newDiary(editIndex=-1){
  const x=editIndex>=0?data.diary[editIndex]:{date:today(),time:"",title:"",body:"",tags:[],photos:[]};
  document.getElementById("app").innerHTML='<div class="card form"><div class="row between"><div class="hero">'+(editIndex>=0?"日記を編集":"新しい日記")+'</div><span class="tag">DAY '+dayNo(x.date)+'</span></div><label>日付</label><input id="dDate" type="date" value="'+esc(x.date)+'"><label>時間</label><input id="dTime" type="time" value="'+esc(x.time||"")+'"><label>タイトル</label><input id="dTitle" value="'+esc(x.title||"")+'" placeholder="今日は何した？"><label>本文</label><textarea id="dBody" placeholder="景色、出来事、感想など">'+esc(x.body||"")+'</textarea><label>タグ（カンマ区切り）</label><input id="dTags" value="'+esc((x.tags||[]).join(", "))+'" placeholder="Waikiki, beach, food"><label>写真</label><input id="dFiles" type="file" accept="image/*" multiple><div class="muted">写真は自動で縮小して保存します。</div>'+(x.photos?.length?'<div class="thumbs editOld">'+x.photos.map((p,j)=>'<div class="photoWrap"><img src="'+p+'"><button class="danger mini" onclick="removeDiaryPhoto('+editIndex+','+j+')">×</button></div>').join("")+'</div>':"")+'<div class="actions"><button onclick="saveDiary('+editIndex+')">保存</button><button class="danger" onclick="tab=\'diary\';render()">キャンセル</button></div></div>';
}
function editDiary(i){newDiary(i)}
function removeDiaryPhoto(i,j){const src=data.diary[i]?.photos?.[j];if(src&&confirm("この写真を日記から外しますか？")){data.diary[i].photos.splice(j,1);data.photos=data.photos.filter(p=>p.src!==src);save();editDiary(i)}}
function compressFile(file,max=1400,quality=.78){
  return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(Math.max(w,h)>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);resolve(c.toDataURL("image/jpeg",quality))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)});
}
async function readFiles(files){return Promise.all(Array.from(files).map(f=>compressFile(f)))}
async async function saveDiary(i){
  const btn=event?.target;if(btn){btn.disabled=true;btn.textContent="保存中…";}
  try{
    const ps=await readFiles(document.getElementById("dFiles").files);
    const base=i>=0?data.diary[i]:{photos:[]};
    const id=base.id||(crypto.randomUUID?crypto.randomUUID():"d"+Date.now()+Math.random().toString(36).slice(2));
    const x={id:id,date:dDate.value,time:dTime.value,title:dTitle.value.trim(),body:dBody.value,tags:dTags.value.split(",").map(s=>s.trim()).filter(Boolean),photos:(base.photos||[]).concat(ps)};
    if(i>=0)data.diary[i]=x;else data.diary.push(x);
    ps.forEach(p=>data.photos.push({src:p,date:x.date,diaryId:id}));
    filter="";diaryFilterDate="";tab="diary";save();
  }catch(e){alert("写真の保存に失敗しました。写真の枚数を減らして再度お試しください。");if(btn){btn.disabled=false;btn.textContent="保存";}}
}

function timeline(){
  const ev=[];
  data.diary.forEach(x=>ev.push({date:x.date,time:x.time||"",kind:"✍️",title:x.title||"無題",body:x.body||""}));
  data.schedule.forEach(x=>ev.push({date:x.date,time:x.time||"",kind:"📅",title:x.title||"予定",body:[x.place,x.note].filter(Boolean).join(" · ")}));
  data.food.forEach(x=>ev.push({date:x.date,time:"",kind:"🍴",title:x.name||"食事",body:[x.dish,x.note].filter(Boolean).join(" · ")}));
  data.places.forEach(x=>ev.push({date:x.date,time:"",kind:"📍",title:x.name||"場所",body:x.note||""}));
  data.money.forEach(x=>ev.push({date:x.date,time:"",kind:"💵",title:x.name||"支出",body:(x.category||"その他")+" · $"+Number(x.amount||0).toFixed(2)}));
  let a=ev.sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));
  if(filter)a=a.filter(x=>(x.title+" "+x.body).toLowerCase().includes(filter.toLowerCase()));
  return '<div class="card"><div class="hero">🕐 タイムライン</div>'+searchBox("日記・予定・食事・場所・支出を検索")+'</div><div class="timeline">'+(a.length?a.map(x=>'<div class="event"><div class="muted">'+fmt(x.date)+' '+esc(x.time||"")+'</div><b>'+x.kind+' '+esc(x.title)+'</b><p>'+esc(x.body).slice(0,220).replace(/\\n/g,"<br>")+'</p></div>').join(""):'<div class="empty">記録すると時系列で表示されます。</div>')+'</div>';
}

function photos(){
  let a=allPhotos().slice().reverse();
  if(filter)a=a.filter(p=>p.date.includes(filter));
  return '<div class="card"><div class="row between"><div class="hero">📷 写真</div><span class="muted">'+a.length+'枚</span></div>'+searchBox("日付（例：2026-10-01）で検索")+'</div>'+(a.length?'<div class="gallery">'+a.map(p=>'<div><img src="'+p.src+'" onclick="openPhotoSrc(\''+p.src+'\')"><div class="muted">'+fmt(p.date)+'</div></div>').join("")+'</div>':'<div class="empty">まだ写真がありません。</div>');
}
function openPhotoSrc(src){
  const list=allPhotos().map(p=>p.src);let idx=Math.max(0,list.indexOf(src));
  const o=document.createElement("div");o.className="lightbox";
  const draw=()=>{o.innerHTML='<img src="'+list[idx]+'"><button class="photoNav photoPrev" onclick="movePhoto(-1)">‹</button><button class="photoNav photoNext" onclick="movePhoto(1)">›</button><button onclick="this.parentElement.remove()">×</button>'};
  window.movePhoto=(n)=>{idx=(idx+n+list.length)%list.length;draw()};draw();document.body.appendChild(o);
  o.addEventListener("touchstart",e=>o._sx=e.changedTouches[0].clientX,{passive:true});
  o.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-o._sx;if(Math.abs(dx)>50)window.movePhoto(dx<0?1:-1)},{passive:true});
}

document.getElementById("nav").onclick=e=>{const b=e.target.closest("button[data-tab]");if(b){tab=b.dataset.tab;filter="";diaryFilterDate="";render()}};
document.getElementById("fab").onclick=()=>newDiary();
render();
</script>
