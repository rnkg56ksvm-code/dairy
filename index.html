<header><div class="wrap"><h1>🌺 Hawaii 2026</h1><div style="font-size:11px;opacity:.8;margin-top:3px">Build 2026-10-01.9</div><p>Oahu · 2026/10/1 — 10/5 · 2人</p><div class="stats"><div class="stat"><b id="day">DAY 1</b><span>旅行日</span></div><div class="stat"><b id="entries">0</b><span>日記</span></div><div class="stat"><b id="photos">0</b><span>写真</span></div></div></div></header>
<nav class="nav" id="nav"><button data-tab="home" class="active">🏝️ ホーム</button><button data-tab="diary">✍️ 日記</button><button data-tab="timeline">🕐 時系列</button><button data-tab="schedule">📅 予定</button><button data-tab="photos">📷 写真</button><button data-tab="food">🍴 食事</button><button data-tab="money">💵 支出</button><button data-tab="info">✈️ 旅行情報</button></nav>
<main class="wrap content" id="app"></main><button class="fab" id="fab">＋</button>
<script>
const KEY="hawaiiDiaryV2";
const START="2026-10-01", END="2026-10-05";
let tab="home", filter="", diaryFilterDate="";
const blank={diary:[],photos:[],food:[],money:[],schedule:[],tripInfo:{start:START,end:END,people:"2人",area:"Oahu / Waikiki",hotel:"The Ambassador Hotel of Waikiki",notes:["10/1 Hula Grill — 予約済み","10/3 ディナー — 記録予定"]}};
let data=loadData();

function loadData(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw)return normalize(JSON.parse(raw));
    const old=localStorage.getItem("hawaiiDiaryV1");
    if(old)return normalize(JSON.parse(old));
  }catch(e){}
  return structuredClone(blank);
}
const DB_NAME="hawaiiDiaryDB", DB_VERSION=1, DB_STORE="app";
function openDB(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open(DB_NAME,DB_VERSION);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(DB_STORE))r.result.createObjectStore(DB_STORE)};
    r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
  });
}
async function dbGet(){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const r=db.transaction(DB_STORE,"readonly").objectStore(DB_STORE).get(KEY);
    r.onsuccess=()=>resolve(r.result||null); r.onerror=()=>reject(r.error);
  });
}
async function dbSet(value){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const r=db.transaction(DB_STORE,"readwrite").objectStore(DB_STORE).put(value,KEY);
    r.onsuccess=()=>resolve(); r.onerror=()=>reject(r.error);
  });
}
async function persist(){
  await dbSet(JSON.stringify({version:4,savedAt:new Date().toISOString(),data}));
  try{localStorage.setItem(KEY+"_meta",JSON.stringify({version:4,savedAt:new Date().toISOString()}))}catch(e){}
}
async function bootData(){
  try{
    const raw=await dbGet();
    if(raw){data=normalize(JSON.parse(raw).data||JSON.parse(raw));render();return}
    const migrated=loadData();
    data=normalize(migrated);
    await dbSet(JSON.stringify({version:4,migratedAt:new Date().toISOString(),data}));
    try{localStorage.removeItem(KEY);localStorage.removeItem("hawaiiDiaryV1")}catch(e){}
  }catch(e){
    data=loadData();
  }
  render();
}
function normalize(d){
  d=Object.assign(structuredClone(blank),d||{});
  d.diary=Array.isArray(d.diary)?d.diary:[];
  d.photos=Array.isArray(d.photos)?d.photos:[];
  d.food=Array.isArray(d.food)?d.food:[];
  d.money=Array.isArray(d.money)?d.money:[];d.schedule=Array.isArray(d.schedule)?d.schedule:[];
  d.tripInfo=Object.assign(structuredClone(blank.tripInfo),d.tripInfo||{});
  d.diary.forEach(x=>{if(!x.id)x.id=(crypto.randomUUID?crypto.randomUUID():"d"+Date.now()+Math.random().toString(36).slice(2));x.photos=Array.isArray(x.photos)?x.photos:[]});
  d.photos=d.photos.filter(x=>x&&x.src).map(x=>Object.assign({},x,{diaryId:x.diaryId||null}));
  const linked=new Set();d.diary.forEach(x=>x.photos.forEach(src=>linked.add(src)));
  d.photos=d.photos.filter(x=>x.diaryId===null||linked.has(x.src));
  d.diary.forEach(x=>x.photos.forEach(src=>{if(!d.photos.some(p=>p.src===src))d.photos.push({src,date:x.date,diaryId:x.id})}));
  d.photos.forEach(p=>{const owner=d.diary.find(x=>x.id===p.diaryId);if(owner)p.date=owner.date});
  return d;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function dateKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function today(){return dateKey(new Date())}
function fmt(d){if(!d)return"";return new Date(d+"T00:00:00").toLocaleDateString("ja-JP",{month:"numeric",day:"numeric",weekday:"short"})}
async function save(){
  try{await persist();render()}
  catch(e){console.error(e);alert("保存に失敗しました。ブラウザの保存領域または空き容量を確認してください。")}
}
function dayNo(d=today()){const x=Math.floor((new Date(d+"T00:00:00")-new Date(START+"T00:00:00"))/86400000)+1;return Math.max(1,Math.min(5,x))}
function allPhotos(){return data.photos}
function stats(){
  const e=document.getElementById("entries"),p=document.getElementById("photos"),day=document.getElementById("day");
  if(e)e.textContent=data.diary.length;
  if(p)p.textContent=allPhotos().length;
  if(day)day.textContent="DAY "+dayNo();
}
function render(){
  stats();
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  let h="";
  if(tab==="home")h=home();
  else if(tab==="diary")h=diary();
  else if(tab==="timeline")h=timeline();else if(tab==="schedule")h=schedule();
  else if(tab==="photos")h=photos();
  else if(tab==="food")h=food();
  else if(tab==="money")h=money();
  else h=info();
  document.getElementById("app").innerHTML=h;
}
function searchBox(placeholder="検索…"){
  return '<div class="searchrow"><input id="searchInput" value="'+esc(filter)+'" placeholder="'+placeholder+'"><button class="small" onclick="filter=document.getElementById(\'searchInput\').value;render()">検索</button><button class="danger small" onclick="filter=\'\';render()">クリア</button></div>';
}
function home(){
  const recent=data.diary.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).slice(0,3);
  const total=data.money.reduce((s,x)=>s+Number(x.amount||0),0);
  const todayDiary=data.diary.filter(x=>x.date===today()).length;
  const todaySpend=data.money.filter(x=>x.date===today()).reduce((s,x)=>s+Number(x.amount||0),0);
  const dayEntries=data.diary.filter(x=>x.date===today()).length;
  return '<div class="card heroCard"><div class="hero">Aloha! 🌺</div><p>今日の思い出を、写真と一緒に残そう。</p><div class="grid"><div class="info"><b>📅 DAY '+dayNo()+'</b><br><span class="muted">'+fmt(today())+'</span></div><div class="info"><b>📝 今日の日記</b><br><span class="muted">'+todayDiary+'件</span></div><div class="info"><b>💵 今日の支出</b><br><span class="muted">'+todaySpend.toFixed(2)+'</span></div><div class="info"><b>💰 旅行支出</b><br><span class="muted">'+total.toFixed(2)+'</span></div></div></div>'+
  '<div class="card"><div class="row between"><div class="hero">📅 旅行スケジュール</div><span class="tag">10/1〜10/5</span></div>'+[1,2,3,4,5].map(n=>{const d=new Date("2026-10-01T00:00:00");d.setDate(d.getDate()+n-1);const ds=dateKey(d),cnt=data.diary.filter(x=>x.date===ds).length;return '<div class="dayRow '+(ds===today()?'current':'')+'" onclick="tab=\'diary\';diaryFilterDate=\''+ds+'\';render()"><b>DAY '+n+'</b><span>'+fmt(ds)+'</span><span class="muted">'+cnt+'件の記録</span></div>'}).join("")+'</div>'+
  '<div class="card"><div class="row between"><b>最近の日記</b><button class="small" onclick="newDiary()">＋追加</button></div>'+(recent.length?recent.map(x=>diaryCard(x,false)).join(""):'<div class="empty">まだ日記がありません。</div>')+'</div>'+
  '<div class="card"><b>📌 旅行メモ</b><p class="muted">🏨 The Ambassador Hotel of Waikiki<br>🍴 10/1 Hula Grill — 予約済み<br>🍴 10/3 ディナー — 記録予定</p></div>';
}
function diaryCard(x,actions=true){
  const i=data.diary.indexOf(x);
  return '<div class="entry"><div class="row between"><div><b>'+esc(x.title||"無題")+'</b><div class="muted">'+fmt(x.date)+(x.time?" "+esc(x.time):"")+'</div></div>'+(actions?'<div class="row"><button class="small" onclick="editDiary('+i+')">編集</button><button class="danger small" onclick="delItem(\'diary\','+i+')">削除</button></div>':"")+'</div><p>'+esc(x.body||"").replace(/\\n/g,"<br>")+'</p>'+((x.tags||[]).map(t=>'<span class="tag">#'+esc(t)+'</span>').join(""))+(x.photos?.length?'<div class="thumbs">'+x.photos.map((p,j)=>'<img src="'+p+'" onclick="openPhotoSrc(\''+p+'\')" alt="photo">').join("")+'</div>':"")+'</div>';
}
function diary(){
  let a=data.diary.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  if(filter)a=a.filter(x=>(x.title+" "+x.body+" "+(x.tags||[]).join(" ")).toLowerCase().includes(filter.toLowerCase()));
  if(diaryFilterDate)a=a.filter(x=>x.date===diaryFilterDate);
  return '<div class="card"><div class="row between"><div class="hero">✍️ 日記</div><button onclick="newDiary()">＋追加</button></div>'+searchBox("タイトル・本文・タグを検索")+'<div class="filterline"><label>日付</label><input type="date" value="'+esc(diaryFilterDate)+'" onchange="diaryFilterDate=this.value;render()"><button class="danger small" onclick="diaryFilterDate=\'\';render()">全日</button></div></div>'+(a.length?a.map(x=>diaryCard(x,true)).join(""):'<div class="empty">条件に一致する日記がありません。</div>');
}
function newDiary(editIndex=-1){
  const x=editIndex>=0?data.diary[editIndex]:{date:today(),time:"",title:"",body:"",tags:[],photos:[]};
  document.getElementById("app").innerHTML='<div class="card form"><div class="row between"><div class="hero">'+(editIndex>=0?"日記を編集":"新しい日記")+'</div><span class="tag">DAY '+dayNo(x.date)+'</span></div><label>日付</label><input id="dDate" type="date" value="'+esc(x.date)+'"><label>時間</label><input id="dTime" type="time" value="'+esc(x.time||"")+'"><label>タイトル</label><input id="dTitle" value="'+esc(x.title||"")+'" placeholder="今日は何した？"><label>本文</label><textarea id="dBody" placeholder="景色、出来事、感想など">'+esc(x.body||"")+'</textarea><label>タグ（カンマ区切り）</label><input id="dTags" value="'+esc((x.tags||[]).join(", "))+'" placeholder="Waikiki, beach, food"><label>写真</label><input id="dFiles" type="file" accept="image/*" multiple><div class="muted">写真は自動で縮小して保存します。</div>'+(x.photos?.length?'<div class="thumbs editOld">'+x.photos.map((p,j)=>'<div class="photoWrap"><img src="'+p+'"><button class="danger mini" onclick="removeDiaryPhoto('+editIndex+','+j+')">×</button></div>').join("")+'</div>':"")+'<div class="actions"><button onclick="saveDiary('+editIndex+')">保存</button><button class="danger" onclick="tab=\'diary\';render()">キャンセル</button></div></div>';
}
function editDiary(i){newDiary(i)}
function removeDiaryPhoto(i,j){const src=data.diary[i]?.photos?.[j];if(src&&confirm("この写真を日記から外しますか？")){data.diary[i].photos.splice(j,1);data.photos=data.photos.filter(p=>p.src!==src);save();editDiary(i)}}
function compressFile(file,max=1600,quality=.72){
  return new Promise(async(resolve,reject)=>{
    try{
      if(!file||!file.type.startsWith("image/")) throw new Error("画像ではありません");
      let source;
      if("createImageBitmap" in window){
        try{source=await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){}
      }
      if(!source){
        const r=new FileReader();
        const url=await new Promise((res,rej)=>{r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)});
        source=await new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=()=>rej(new Error("この画像形式をブラウザで読み込めません"));img.src=url});
      }
      let w=source.width,h=source.height;
      if(Math.max(w,h)>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      const ctx=c.getContext("2d",{alpha:false});ctx.drawImage(source,0,0,w,h);
      if(source.close)source.close();
      resolve(c.toDataURL("image/jpeg",quality));
    }catch(e){reject(e)}
  });
}
async function readFiles(files){
  const arr=Array.from(files||[]);
  if(arr.length>20) throw new Error("写真は一度に20枚までです");
  const out=[];
  for(let i=0;i<arr.length;i++){
    try{out.push(await compressFile(arr[i]))}
    catch(e){console.warn("写真をスキップ:",arr[i]?.name,e)}
  }
  if(arr.length&&!out.length) throw new Error("選択した写真を読み込めませんでした");
  return out;
}
async function saveDiary(i){
  const btn=event?.target;if(btn){btn.disabled=true;btn.textContent="保存中…";}
  const input=document.getElementById("dFiles");
  if(!input) return;
  try{
    const ps=await readFiles(document.getElementById("dFiles").files);
    const base=i>=0?data.diary[i]:{photos:[]};
    const id=base.id||(crypto.randomUUID?crypto.randomUUID():"d"+Date.now()+Math.random().toString(36).slice(2));
    const x={id:id,date:dDate.value,time:dTime.value,title:dTitle.value.trim(),body:dBody.value,tags:dTags.value.split(",").map(s=>s.trim()).filter(Boolean),photos:(base.photos||[]).concat(ps)};
    if(i>=0)data.diary[i]=x;else data.diary.push(x);
    ps.forEach(p=>data.photos.push({src:p,date:x.date,diaryId:id}));
    filter="";diaryFilterDate="";tab="diary";save();
  }catch(e){alert("写真の保存に失敗しました。写真の枚数を減らして再度お試しください。");if(btn){btn.disabled=false;btn.textContent="保存";}}
}

function timeline(){
  const ev=[];
  data.diary.forEach(x=>ev.push({date:x.date,time:x.time||"",kind:"✍️",title:x.title||"無題",body:x.body||""}));
  data.schedule.forEach(x=>ev.push({date:x.date,time:x.time||"",kind:"📅",title:x.title||"予定",body:[x.place,x.note].filter(Boolean).join(" · ")}));
  data.food.forEach(x=>ev.push({date:x.date,time:"",kind:"🍴",title:x.name||"食事",body:[x.dish,x.note].filter(Boolean).join(" · ")}));
  data.money.forEach(x=>ev.push({date:x.date,time:"",kind:"💵",title:x.name||"支出",body:(x.category||"その他")+" · $"+Number(x.amount||0).toFixed(2)}));
  let a=ev.sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));
  if(filter)a=a.filter(x=>(x.title+" "+x.body).toLowerCase().includes(filter.toLowerCase()));
  return '<div class="card"><div class="hero">🕐 タイムライン</div>'+searchBox("日記・予定・食事・場所・支出を検索")+'</div><div class="timeline">'+(a.length?a.map(x=>'<div class="event"><div class="muted">'+fmt(x.date)+' '+esc(x.time||"")+'</div><b>'+x.kind+' '+esc(x.title)+'</b><p>'+esc(x.body).slice(0,220).replace(/\\n/g,"<br>")+'</p></div>').join(""):'<div class="empty">記録すると時系列で表示されます。</div>')+'</div>';
}

function photos(){
  let a=allPhotos().slice().reverse();
  if(filter)a=a.filter(p=>p.date.includes(filter));
  return '<div class="card"><div class="row between"><div class="hero">📷 写真</div><span class="muted">'+a.length+'枚</span></div>'+searchBox("日付（例：2026-10-01）で検索")+'</div>'+(a.length?'<div class="gallery">'+a.map(p=>'<div><img src="'+p.src+'" onclick="openPhotoSrc(\''+p.src+'\')"><div class="muted">'+fmt(p.date)+'</div></div>').join("")+'</div>':'<div class="empty">まだ写真がありません。</div>');
}
function openPhotoSrc(src){
  const list=allPhotos().map(p=>p.src);let idx=Math.max(0,list.indexOf(src));
  const o=document.createElement("div");o.className="lightbox";
  const draw=()=>{o.innerHTML='<img src="'+list[idx]+'"><button class="photoNav photoPrev" onclick="movePhoto(-1)">‹</button><button class="photoNav photoNext" onclick="movePhoto(1)">›</button><button onclick="this.parentElement.remove()">×</button>'};
  window.movePhoto=(n)=>{idx=(idx+n+list.length)%list.length;draw()};draw();document.body.appendChild(o);
  o.addEventListener("touchstart",e=>o._sx=e.changedTouches[0].clientX,{passive:true});
  o.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-o._sx;if(Math.abs(dx)>50)window.movePhoto(dx<0?1:-1)},{passive:true});
}

function food(){

}

function saveFood(i){const x={date:fDate.value,name:fName.value.trim(),dish:fDish.value,amount:Number(fAmount.value||0),rating:fRating.value,note:fNote.value};if(!x.name)return alert("店名を入力してください");if(i>=0)data.food[i]=x;else data.food.push(x);tab="food";save()}

function money(){
  let a=data.money.slice().sort((x,y)=>y.date.localeCompare(x.date));
  if(filter)a=a.filter(x=>(x.name+" "+x.category+" "+x.note).toLowerCase().includes(filter.toLowerCase()));
  const total=data.money.reduce((s,x)=>s+Number(x.amount||0),0),cats={};data.money.forEach(x=>cats[x.category||"その他"]=(cats[x.category||"その他"]||0)+Number(x.amount||0));
  return '<div class="card"><div class="row between"><div class="hero">💵 支出</div><div class="expense">$'+total.toFixed(2)+'</div></div><button onclick="addMoney()">＋支出を追加</button>'+searchBox("内容・カテゴリを検索")+'<div class="catGrid">'+Object.keys(cats).map(k=>'<div class="info"><b>'+esc(k)+'</b><br>$'+cats[k].toFixed(2)+'</div>').join("")+'</div></div>'+(a.length?a.map(x=>'<div class="card"><div class="row between"><div><b>'+esc(x.name)+'</b><div class="muted">'+fmt(x.date)+' · '+esc(x.category||"その他")+'</div></div><div><b>$'+Number(x.amount||0).toFixed(2)+'</b><br><button class="small" onclick="addMoney('+data.money.indexOf(x)+')">編集</button> <button class="danger small" onclick="delItem(\'money\','+data.money.indexOf(x)+')">削除</button></div></div>'+(x.note?'<p class="muted">'+esc(x.note)+'</p>':"")+'</div>').join(""):'<div class="empty">支出を追加できます。</div>');
}
function addMoney(i=-1){
  const x=i>=0?data.money[i]:{date:today(),name:"",category:"食事",amount:"",note:""},cats=["食事","交通","ホテル","買い物","観光","その他"];
  document.getElementById("app").innerHTML='<div class="card form"><div class="hero">💵 '+(i>=0?"支出を編集":"支出を追加")+'</div><label>日付</label><input id="mDate" type="date" value="'+esc(x.date)+'"><label>内容</label><input id="mName" value="'+esc(x.name)+'"><label>カテゴリ</label><select id="mCat">'+cats.map(v=>'<option '+(x.category===v?"selected":"")+'>'+v+'</option>').join("")+'</select><label>金額（USD）</label><input id="mAmount" type="number" step="0.01" value="'+esc(x.amount||"")+'"><label>メモ</label><textarea id="mNote">'+esc(x.note||"")+'</textarea><div class="actions"><button onclick="saveMoney('+i+')">保存</button><button class="danger" onclick="tab=\'money\';render()">キャンセル</button></div></div>';
}
function saveMoney(i){const x={date:mDate.value,name:mName.value.trim(),category:mCat.value,amount:Number(mAmount.value||0),note:mNote.value};if(!x.name||!x.amount)return alert("内容と金額を入力してください");if(i>=0)data.money[i]=x;else data.money.push(x);tab="money";save()}

function schedule(){
  const a=data.schedule.slice().sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));
  return '<div class="card"><div class="row between"><div class="hero">📅 予定</div><button onclick="addSchedule()">＋追加</button></div><p class="muted">旅行中の予約・移動・観光予定を時間順に管理できます。</p></div><div class="card">'+[1,2,3,4,5].map(n=>{const d=new Date(START+"T00:00:00");d.setDate(d.getDate()+n-1);const ds=dateKey(d),items=a.filter(x=>x.date===ds);return '<div class="entry"><b>DAY '+n+' · '+fmt(ds)+'</b>'+(items.length?items.map(x=>'<div class="info" style="margin-top:8px"><b>'+esc(x.time||"時間未設定")+'　'+esc(x.title)+'</b><div class="muted">'+esc(x.place||"")+'</div>'+(x.note?'<p>'+esc(x.note)+'</p>':"")+'<button class="small" onclick="addSchedule(\''+x.date+'\','+data.schedule.indexOf(x)+')">編集</button> <button class="danger small" onclick="delItem(\'schedule\','+data.schedule.indexOf(x)+')">削除</button></div>').join(""):'<div class="empty">予定なし</div>')+'</div>'}).join("")+'</div>';
}
function addSchedule(date="",i=-1){const x=i>=0?data.schedule[i]:{date:date||today(),time:"",title:"",place:"",note:""};document.getElementById("app").innerHTML='<div class="card form"><div class="hero">📅 '+(i>=0?"予定を編集":"予定を追加")+'</div><label>日付</label><input id="sDate" type="date" value="'+esc(x.date)+'"><label>時間</label><input id="sTime" type="time" value="'+esc(x.time||"")+'"><label>予定</label><input id="sTitle" value="'+esc(x.title||"")+'"><label>場所</label><input id="sPlace" value="'+esc(x.place||"")+'"><label>メモ</label><textarea id="sNote">'+esc(x.note||"")+'</textarea><div class="actions"><button onclick="saveSchedule('+i+')">保存</button><button class="danger" onclick="tab=\'schedule\';render()">キャンセル</button></div></div>'}
function saveSchedule(i){const x={date:sDate.value,time:sTime.value,title:sTitle.value.trim(),place:sPlace.value,note:sNote.value};if(!x.title)return alert("予定を入力してください");if(i>=0)data.schedule[i]=x;else data.schedule.push(x);tab="schedule";save()}

function editInfo(){const t=data.tripInfo;document.getElementById("app").innerHTML='<div class="card form"><div class="hero">✈️ 旅行情報を編集</div><label>開始日</label><input id="iStart" type="date" value="'+esc(t.start)+'"><label>終了日</label><input id="iEnd" type="date" value="'+esc(t.end)+'"><label>人数</label><input id="iPeople" value="'+esc(t.people)+'"><label>エリア</label><input id="iArea" value="'+esc(t.area)+'"><label>ホテル</label><input id="iHotel" value="'+esc(t.hotel)+'"><label>予約メモ（1行1件）</label><textarea id="iNotes">'+esc(t.notes.join("\n"))+'</textarea><div class="actions"><button onclick="saveInfo()">保存</button><button class="danger" onclick="tab=\'info\';render()">キャンセル</button></div></div>'}
function saveInfo(){if(!iStart.value||!iEnd.value||iStart.value>iEnd.value)return alert("日程を正しく入力してください");data.tripInfo={start:iStart.value,end:iEnd.value,people:iPeople.value.trim(),area:iArea.value.trim(),hotel:iHotel.value.trim(),notes:iNotes.value.split("\n").map(x=>x.trim()).filter(Boolean)};tab="info";save()}
function delItem(type,i){if(!confirm("削除しますか？"))return;if(type==="diary"){const x=data.diary[i];if(x?.id)data.photos=data.photos.filter(p=>p.diaryId!==x.id);else if(x?.photos)data.photos=data.photos.filter(p=>!x.photos.includes(p.src));}data[type].splice(i,1);save()}
function exportData(){const blob=new Blob([JSON.stringify({version:4,exportedAt:new Date().toISOString(),data},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="hawaii-diary-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(file){if(!file)return;if(!confirm("現在のデータをバックアップ内容で置き換えます。続行しますか？"))return;const r=new FileReader();r.onload=async()=>{try{const x=JSON.parse(r.result);data=normalize(x.data||x);await persist();render();alert("復元しました")}catch(e){console.error(e);alert("バックアップの読み込みに失敗しました。")}};r.readAsText(file)}

document.getElementById("nav").onclick=e=>{const b=e.target.closest("button[data-tab]");if(b){tab=b.dataset.tab;filter="";diaryFilterDate="";render()}};
document.getElementById("fab").onclick=()=>newDiary();
bootData();
</script>
