<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f8c"><title>Hawaii 2026 Diary</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7f8;color:#18343f}header{background:linear-gradient(135deg,#087f8c,#38a3a5);color:white;padding:28px 18px 22px;border-radius:0 0 26px 26px}.wrap{max-width:760px;margin:auto}h1{margin:0;font-size:30px}header p{margin:7px 0;opacity:.9}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:17px}.stat{background:#ffffff22;padding:9px;border-radius:13px;text-align:center}.stat b{display:block;font-size:19px}.nav{position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid #e1e7e9;display:flex;overflow:auto}.nav button{background:none;color:#60777d;border-radius:0;white-space:nowrap;padding:13px 11px}.nav button.active{color:#087f8c;border-bottom:3px solid #087f8c}.content{padding:18px}.card{background:white;border-radius:18px;padding:17px;margin-bottom:14px;box-shadow:0 2px 12px #18343f10}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.hero{font-size:22px;font-weight:800}.muted{font-size:13px;color:#71858b}.tag{display:inline-block;background:#e2f4f3;color:#087580;padding:5px 9px;border-radius:99px;font-size:12px;margin:3px}.empty{text-align:center;padding:28px;color:#809297}.timeline{border-left:3px solid #b7dede;padding-left:17px;margin-left:7px}.event{position:relative;margin:0 0 20px}.event:before{content:"";position:absolute;left:-25px;top:5px;width:9px;height:9px;background:#087f8c;border-radius:50%}.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.form label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}.form input,.form textarea{width:100%;padding:12px;border:1px solid #d6e0e3;border-radius:12px}.form textarea{min-height:130px}.actions{display:flex;gap:8px;margin-top:15px}button{border:0;border-radius:13px;padding:11px 14px;background:#087f8c;color:white;font-weight:700}.danger{background:white;color:#c0392b;border:1px solid #e0c6c2}.small{padding:7px 10px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info{background:#f3f7f8;border-radius:13px;padding:12px}.expense{font-size:23px;font-weight:800}.fab{position:fixed;right:18px;bottom:22px;width:58px;height:58px;border-radius:50%;font-size:26px;box-shadow:0 5px 18px #0003}@media(min-width:700px){.content{padding:25px 0}}
</style></head><body>
<header><div class="wrap"><h1>🌺 Hawaii 2026</h1><p>Oahu · 2026/10/1 — 10/5 · 2人</p><div class="stats"><div class="stat"><b id="day">DAY 1</b><span>旅行日</span></div><div class="stat"><b id="entries">0</b><span>日記</span></div><div class="stat"><b id="photos">0</b><span>写真</span></div></div></div></header>
<nav class="nav" id="nav"><button data-tab="home" class="active">🏝️ ホーム</button><button data-tab="diary">✍️ 日記</button><button data-tab="timeline">🕐 時系列</button><button data-tab="photos">📷 写真</button><button data-tab="food">🍴 食事</button><button data-tab="places">📍 場所</button><button data-tab="money">💵 支出</button><button data-tab="info">✈️ 旅行情報</button></nav>
<main class="wrap content" id="app"></main><button class="fab" id="fab">＋</button>
<script>
var KEY="hawaiiDiaryV1";
var data=JSON.parse(localStorage.getItem(KEY)||'{"diary":[],"photos":[],"food":[],"places":[],"money":[]}');
var tab="home";
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){return new Date().toISOString().slice(0,10)}
function fmt(d){return new Date(d+"T00:00:00").toLocaleDateString("ja-JP",{month:"numeric",day:"numeric",weekday:"short"})}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function stats(){document.getElementById("entries").textContent=data.diary.length;document.getElementById("photos").textContent=data.photos.length;var d=Math.floor((new Date()-new Date("2026-10-01"))/86400000)+1;document.getElementById("day").textContent="DAY "+Math.max(1,Math.min(5,d))}
function render(){
stats();document.querySelectorAll(".nav button").forEach(function(b){b.classList.toggle("active",b.dataset.tab===tab)});
var h="";if(tab==="home")h=home();else if(tab==="diary")h=diary();else if(tab==="timeline")h=timeline();else if(tab==="photos")h=photos();else if(tab==="food")h=simple("food","🍴 食事");else if(tab==="places")h=simple("places","📍 場所");else if(tab==="money")h=money();else h=info();document.getElementById("app").innerHTML=h
}
function home(){var r=data.diary.slice().sort(function(a,b){return (b.date+b.time).localeCompare(a.date+a.time)}).slice(0,3);return '<div class="card"><div class="hero">Aloha! 🌺</div><p>今回のハワイ旅行を写真と一緒に残そう。</p><div class="grid"><div class="info"><b>🏨 Waikiki</b><br><span class="muted">The Ambassador Hotel</span></div><div class="info"><b>🍴 10/1</b><br><span class="muted">Hula Grill 予約済み</span></div></div></div><div class="card"><div class="row between"><b>最近の日記</b><button class="small" onclick="newDiary()">＋追加</button></div>'+(r.length?r.map(function(x){return '<div class="event" style="margin-top:18px"><b>'+esc(x.title||"無題")+'</b><div class="muted">'+fmt(x.date)+" "+esc(x.time)+'</div><div>'+esc((x.body||"").slice(0,100))+"</div></div>"}).join(""):'<div class="empty">まだ日記がありません。</div>')+'</div>'}
function diary(){var a=data.diary.slice().sort(function(a,b){return (b.date+b.time).localeCompare(a.date+a.time)});return '<div class="card"><div class="row between"><div class="hero">✍️ 日記</div><button onclick="newDiary()">＋追加</button></div></div>'+(a.length?a.map(function(x){var i=data.diary.indexOf(x);return '<div class="card"><div class="row between"><div><b>'+esc(x.title||"無題")+'</b><div class="muted">'+fmt(x.date)+" "+esc(x.time)+'</div></div><button class="danger small" onclick="delItem(\'diary\','+i+')">削除</button></div><p>'+esc(x.body)+'</p>'+((x.tags||[]).map(function(t){return '<span class="tag">#'+esc(t)+"</span>"}).join(""))+(x.photos&&x.photos.length?'<div class="thumbs" style="margin-top:10px">'+x.photos.map(function(p){return '<img src="'+p+'">'}).join("")+"</div>":"")+"</div>"}).join(""):'<div class="empty">＋から日記を追加できます。</div>')}
function newDiary(){document.getElementById("app").innerHTML='<div class="card form"><div class="hero">新しい日記</div><label>日付</label><input id="dDate" type="date" value="'+today()+'"><label>時間</label><input id="dTime" type="time"><label>タイトル</label><input id="dTitle" placeholder="今日は何した？"><label>本文</label><textarea id="dBody" placeholder="景色、出来事、感想など"></textarea><label>タグ（カンマ区切り）</label><input id="dTags" placeholder="Waikiki, beach, food"><label>写真</label><input id="dFiles" type="file" accept="image/*" multiple><div class="actions"><button onclick="addDiary()">保存</button><button class="danger" onclick="render()">キャンセル</button></div></div>'}
function readFiles(files){return Promise.all(Array.from(files).map(function(f){return new Promise(function(resolve){var r=new FileReader();r.onload=function(){resolve(r.result)};r.readAsDataURL(f)})}))}
async function addDiary(){var ps=await readFiles(document.getElementById("dFiles").files);data.diary.push({date:dDate.value,time:dTime.value,title:dTitle.value,body:dBody.value,tags:dTags.value.split(",").map(function(x){return x.trim()}).filter(Boolean),photos:ps});ps.forEach(function(p){data.photos.push({src:p,date:dDate.value})});tab="diary";save()}
function timeline(){var a=data.diary.slice().sort(function(x,y){return (x.date+x.time).localeCompare(y.date+y.time)});return '<div class="card"><div class="hero">🕐 タイムライン</div></div><div class="timeline">'+(a.length?a.map(function(x){return '<div class="event"><b>'+esc(x.title||"無題")+'</b><div class="muted">'+fmt(x.date)+" "+esc(x.time)+'</div><p>'+esc(x.body)+'</p></div>'}).join(""):'<div class="empty">記録すると時系列で表示されます。</div>')+"</div>"}
function photos(){return '<div class="card"><div class="hero">📷 写真</div><p class="muted">日記に追加した写真がここに集まります。</p></div>'+(data.photos.length?'<div class="thumbs">'+data.photos.map(function(p){return '<div><img src="'+p.src+'"><div class="muted">'+fmt(p.date)+"</div></div>"}).join("")+'</div>':'<div class="empty">まだ写真がありません。</div>')}
function simple(type,title){var a=data[type];return '<div class="card"><div class="row between"><div class="hero">'+title+'</div><button onclick="addSimple(\''+type+"')">＋追加</button></div></div>"+(a.length?a.map(function(x,i){return '<div class="card"><div class="row between"><div><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.date)+'</div></div><button class="danger small" onclick="delItem(\''+type+"',"+i+')">削除</button></div>'+(x.note?'<p>'+esc(x.note)+"</p>":"")+"</div>"}).join(""):'<div class="empty">まだありません。</div>')}
function addSimple(type){var labels={food:["店・料理名","メモ"],places:["場所","メモ"],money:["内容","金額（USD）"]};var n=prompt(labels[type][0]);if(!n)return;var v=prompt(labels[type][1]);var o={name:n,date:today()};if(type==="money")o.amount=Number(v||0);else o.note=v||"";data[type].push(o);save()}
function money(){var total=data.money.reduce(function(s,x){return s+Number(x.amount||0)},0);return '<div class="card"><div class="row between"><div class="hero">💵 支出</div><div class="expense">$'+total.toFixed(2)+"</div></div><button onclick=\"addSimple('money')\">＋支出を追加</button></div>"+(data.money.length?data.money.map(function(x,i){return '<div class="card"><div class="row between"><div><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.date)+'</div></div><div><b>$'+Number(x.amount).toFixed(2)+'</b><br><button class="danger small" onclick="delItem(\'money\','+i+')">削除</button></div></div></div>"}).join(""):'<div class="empty">支出を追加できます。</div>')}
function info(){return '<div class="card"><div class="hero">✈️ 旅行情報</div><div class="grid" style="margin-top:15px"><div class="info"><b>📅 日程</b><br>2026/10/1〜10/5</div><div class="info"><b>👫 人数</b><br>2人</div><div class="info"><b>📍 エリア</b><br>Oahu / Waikiki</div><div class="info"><b>🏨 ホテル</b><br>The Ambassador Hotel of Waikiki</div></div></div><div class="card"><b>予約メモ</b><p>🍴 10/1 Hula Grill — 予約済み</p><p>🍴 10/3 ディナー — 記録欄</p></div>'}
function delItem(type,i){if(confirm("削除しますか？")){data[type].splice(i,1);save()}}
document.getElementById("nav").onclick=function(e){var b=e.target.closest("button[data-tab]");if(b){tab=b.dataset.tab;render()}};document.getElementById("fab").onclick=newDiary;render();
</script></body></html>
