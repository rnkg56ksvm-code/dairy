<header><div class="wrap"><h1>🌺 Hawaii 2026</h1><div style="font-size:11px;opacity:.8;margin-top:3px">Build 2026-10-01.2</div><p>Oahu · 2026/10/1 — 10/5 · 2人</p><div class="stats"><div class="stat"><b id="day">DAY 1</b><span>旅行日</span></div><div class="stat"><b id="entries">0</b><span>日記</span></div><div class="stat"><b id="photos">0</b><span>写真</span></div></div></div></header>
<nav class="nav" id="nav"><button data-tab="home" class="active">🏝️ ホーム</button><button data-tab="diary">✍️ 日記</button><button data-tab="timeline">🕐 時系列</button><button data-tab="schedule">📅 予定</button><button data-tab="photos">📷 写真</button><button data-tab="food">🍴 食事</button><button data-tab="places">📍 場所</button><button data-tab="money">💵 支出</button><button data-tab="info">✈️ 旅行情報</button></nav>
<main class="wrap content" id="app"></main><button class="fab" id="fab">＋</button>
<script>
const KEY="hawaiiDiaryV2";
const START="2026-10-01", END="2026-10-05";
let tab="home", filter="", diaryFilterDate="";
const blank={diary:[],photos:[],food:[],places:[],money:[],schedule:[]};
let data=loadData();

function loadData(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw)return normalize(JSON.parse(raw));
    const old=localStorage.getItem("hawaiiDiaryV1");
    if(old)return normalize(JSON.parse(old));
  }catch(e){}
  return structuredClone(blank);
}
function normalize(d){
  d=Object.assign(structuredClone(blank),d||{});
  d.diary=Array.isArray(d.diary)?d.diary:[];
  d.photos=Array.isArray(d.photos)?d.photos:[];
  d.food=Array.isArray(d.food)?d.food:[];
  d.places=Array.isArray(d.places)?d.places:[];
  d.money=Array.isArray(d.money)?d.money:[];d.schedule=Array.isArray(d.schedule)?d.schedule:[];
  return d;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function fmt(d){if(!d)return"";return new Date(d+"T00:00:00").toLocaleDateString("ja-JP",{month:"numeric",day:"numeric",weekday:"short"})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));render()}catch(e){alert("保存容量を超えました。写真を減らすか、バックアップを書き出してください。")}}
function dayNo(d=today()){const x=Math.floor((new Date(d+"T00:00:00")-new Date(START+"T00:00:00"))/86400000)+1;return Math.max(1,Math.min(5,x))}
function allPhotos(){return data.photos}
function stats(){
  const e=document.getElementById("entries"),p=document.getElementById("photos"),day=document.getElementById("day");
  if(e)e.textContent=data.diary.length;
  if(p)p.textContent=allPhotos().length;
  if(day)day.textContent="DAY "+dayNo();
}
function render(){
  stats();
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  let h="";
  if(tab==="home")h=home();
  else if(tab==="diary")h=diary();
  else if(tab==="timeline")h=timeline();else if(tab==="schedule")h=schedule();
  else if(tab==="photos")h=photos();
  else if(tab==="food")h=food();
  else if(tab==="places")h=places();
  else if(tab==="money")h=money();
  else h=info();
  document.getElementById("app").innerHTML=h;
}
function searchBox(placeholder="検索…"){
  return '<div class="searchrow"><input id="searchInput" value="'+esc(filter)+'" placeholder="'+placeholder+'"><button class="small" onclick="filter=document.getElementById(\'searchInput\').value;render()">検索</button><button class="danger small" onclick="filter=\'\';render()">クリア</button></div>';
}
function home(){
  const recent=data.diary.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).slice(0,3);
  const total=data.money.reduce((s,x)=>s+Number(x.amount||0),0);
  const todayDiary=data.diary.filter(x=>x.date===today()).length;
  const todaySpend=data.money.filter(x=>x.date===today()).reduce((s,x)=>s+Number(x.amount||0),0);
  const dayEntries=data.diary.filter(x=>x.date===today()).length;
  return '<div class="card heroCard"><div class="hero">Aloha! 🌺</div><p>今日の思い出を、写真と一緒に残そう。</p><div class="grid"><div class="info"><b>📅 DAY '+dayNo()+'</b><br><span class="muted">'+fmt(today())+'</span></div><div class="info"><b>📝 今日の日記</b><br><span class="muted">'+todayDiary+'件</span></div><div class="info"><b>💵 今日の支出</b><br><span class="muted">'+todaySpend.toFixed(2)+'</span></div><div class="info"><b>💰 旅行支出</b><br><span class="muted">'+total.toFixed(2)+'</span></div></div></div>'+
  '<div class="card"><div class="row between"><div class="hero">📅 旅行スケジュール</div><span class="tag">10/1〜10/5</span></div>'+[1,2,3,4,5].map(n=>{const d=new Date("2026-10-01T00:00:00");d.setDate(d.getDate()+n-1);const ds=d.toISOString().slice(0,10),cnt=data.diary.filter(x=>x.date===ds).length;return '<div class="dayRow '+(ds===today()?'current':'')+'" onclick="tab=\'diary\';diaryFilterDate=\''+ds+'\';render()"><b>DAY '+n+'</b><span>'+fmt(ds)+'</span><span class="muted">'+cnt+'件の記録</span></div>'}).join("")+'</div>'+
  '<div class="card"><div class="row between"><b>最近の日記</b><button class="small" onclick="newDiary()">＋追加</button></div>'+(recent.length?recent.map(x=>diaryCard(x,false)).join(""):'<div class="empty">まだ日記がありません。</div>')+'</div>'+
  '<div class="card"><b>📌 旅行メモ</b><p class="muted">🏨 The Ambassador Hotel of Waikiki<br>🍴 10/1 Hula Grill — 予約済み<br>🍴 10/3 ディナー — 記録予定</p></div>';
}
function diaryCard(x,actions=true){
  const i=data.diary.indexOf(x);
  return '<div class="entry"><div class="row between"><div><b>'+esc(x.title||"無題")+'</b><div class="muted">'+fmt(x.date)+(x.time?" "+esc(x.time):"")+'</div></div>'+(actions?'<div class="row"><button class="small" onclick="editDiary('+i+')">編集</button><button class="danger small" onclick="delItem(\'diary\','+i+')">削除</button></div>':"")+'</div><p>'+esc(x.body||"").replace(/\\n/g,"<br>")+'</p>'+((x.tags||[]).map(t=>'<span class="tag">#'+esc(t)+'</span>').join(""))+(x.photos?.length?'<div class="thumbs">'+x.photos.map((p,j)=>'<img src="'+p+'" onclick="openPhotoSrc(\''+p+'\')" alt="photo">').join("")+'</div>':"")+'</div>';
}
function diary(){
  let a=data.diary.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  if(filter)a=a.filter(x=>(x.title+" "+x.body+" "+(x.tags||[]).join(" ")).toLowerCase().includes(filter.toLowerCase()));
  if(diaryFilterDate)a=a.filter(x=>x.date===diaryFilterDate);
  return '<div class="card"><div class="row between"><div class="hero">✍️ 日記</div><button onclick="newDiary()">＋追加</button></div>'+searchBox("タイトル・本文・タグを検索")+'<div class="filterline"><label>日付</label><input type="date" value="'+esc(diaryFilterDate)+'" onchange="diaryFilterDate=this.value;render()"><button class="danger small" onclick="diaryFilterDate=\'\';render()">全日</button></div></div>'+(a.length?a.map(x=>diaryCard(x,true)).join(""):'<div class="empty">条件に一致する日記がありません。</div>');
}
function newDiary(editIndex=-1){
  const x=editIndex>=0?data.diary[editIndex]:{date:today(),time:"",title:"",body:"",tags:[],photos:[]};
  document.getElementById("app").innerHTML='<div class="card form"><div class="row between"><div class="hero">'+(editIndex>=0?"日記を編集":"新しい日記")+'</div><span class="tag">DAY '+dayNo(x.date)+'</span></div><label>日付</label><input id="dDate" type="date" value="'+esc(x.date)+'"><label>時間</label><input id="dTime" type="time" value="'+esc(x.time||"")+'"><label>タイトル</label><input id="dTitle" value="'+esc(x.title||"")+'" placeholder="今日は何した？"><label>本文</label><textarea id="dBody" placeholder="景色、出来事、感想など">'+esc(x.body||"")+'</textarea><label>タグ（カンマ区切り）</label><input id="dTags" value="'+esc((x.tags||[]).join(", "))+'" placeholder="Waikiki, beach, food"><label>写真</label><input id="dFiles" type="file" accept="image/*" multiple><div class="muted">写真は自動で縮小して保存します。</div>'+(x.photos?.length?'<div class="thumbs editOld">'+x.photos.map((p,j)=>'<div class="photoWrap"><img src="'+p+'"><button class="danger mini" onclick="removeDiaryPhoto('+editIndex+','+j+')">×</button></div>').join("")+'</div>':"")+'<div class="actions"><button onclick="saveDiary('+editIndex+')">保存</button><button class="danger" onclick="tab=\'diary\';render()">キャンセル</button></div></div>';
}
function editDiary(i){newDiary(i)}
function removeDiaryPhoto(i,j){if(confirm("この写真を日記から外しますか？")){data.diary[i].photos.splice(j,1);save();editDiary(i)}}
function compressFile(file,max=1400,quality=.78){
  return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(Math.max(w,h)>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);resolve(c.toDataURL("image/jpeg",quality))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)});
}
async function readFiles(files){return Promise.all(Array.from(files).map(f=>compressFile(f)))}
async function saveDiary(i){
  const ps=await readFiles(document.getElementById("dFiles").files);
  const base=i>=0?data.diary[i]:{photos:[]};
  const x={date:dDate.value,time:dTime.value,title:dTitle.value,body:dBody.value,tags:dTags.value.split(",").map(s=>s.trim()).filter(Boolean),photos:(base.photos||[]).concat(ps)};
  if(i>=0)data.diary[i]=x;else data.diary.push(x);
  ps.forEach(p=>data.photos.push({src:p,date:x.date,diaryId:i>=0?i:null}));
  filter="";diaryFilterDate="";tab="diary";save();
}
function timeline(){
  let a=data.diary.slice().sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));
  if(filter)a=a.filter(x=>(x.title+" "+x.body).toLowerCase().includes(filter.toLowerCase()));
  return '<div class="card"><div class="hero">🕐 タイムライン</div>'+searchBox("タイムラインを検索")+'</div><div class="timeline">'+(a.length?a.map(x=>'<div class="event"><div class="muted">'+fmt(x.date)+' '+esc(x.time||"")+'</div><b>'+esc(x.title||"無題")+'</b><p>'+esc(x.body||"").slice(0,220).replace(/\\n/g,"<br>")+'</p></div>').join(""):'<div class="empty">記録すると時系列で表示されます。</div>')+'</div>';
}
function photos(){
  let a=allPhotos().slice().reverse();
  if(filter)a=a.filter(p=>p.date.includes(filter));
  return '<div class="card"><div class="row between"><div class="hero">📷 写真</div><span class="muted">'+a.length+'枚</span></div>'+searchBox("日付（例：2026-10-01）で検索")+'</div>'+(a.length?'<div class="gallery">'+a.map(p=>'<div><img src="'+p.src+'" onclick="openPhotoSrc(\''+p.src+'\')"><div class="muted">'+fmt(p.date)+'</div></div>').join("")+'</div>':'<div class="empty">まだ写真がありません。</div>');
}
function openPhotoSrc(src){const o=document.createElement("div");o.className="lightbox";o.innerHTML='<img src="'+src+'"><button onclick="this.parentElement.remove()">×</button>';document.body.appendChild(o)}
function food(){
  let a=data.food.slice().sort((x,y)=>y.date.localeCompare(x.date));
  if(filter)a=a.filter(x=>(x.name+" "+x.dish+" "+x.note).toLowerCase().includes(filter.toLowerCase()));
  return '<div class="card"><div class="row between"><div class="hero">🍴 食事</div><button onclick="addFood()">＋追加</button></div>'+searchBox("店名・料理名・メモを検索")+'</div>'+(a.length?a.map(x=>'<div class="card"><div class="row between"><div><b>'+esc(x.name)+'</b><div class="muted">'+fmt(x.date)+' · '+esc(x.dish||"")+'</div></div><button class="danger small" onclick="delItem(\'food\','+data.food.indexOf(x)+')">削除</button></div>'+(x.rating?'⭐'.repeat(Number(x.rating)):"")+(x.amount?'<div class="price">'+Number(x.amount).toFixed(2)+'</div>':"")+(x.note?'<p>'+esc(x.note)+'</p>':"")+'</div>').join(""):'<div class="empty">食事の記録を追加できます。</div>');
}
function addFood(i=-1){
  const x=i>=0?data.food[i]:{date:today(),name:"",dish:"",amount:"",rating:"",note:""};
  document.getElementById("app").innerHTML='<div class="card form"><div class="hero">🍴 '+(i>=0?"食事を編集":"食事を追加")+'</div><label>日付</label><input id="fDate" type="date" value="'+esc(x.date)+'"><label>店名</label><input id="fName" value="'+esc(x.name)+'" placeholder="例：Hula Grill"><label>料理</label><input id="fDish" value="'+esc(x.dish||"")+'" placeholder="例：ステーキ"><label>金額（USD）</label><input id="fAmount" type="number" step="0.01" value="'+esc(x.amount||"")+'"><label>評価</label><select id="fRating"><option value="">未評価</option>'+[1,2,3,4,5].map(n=>'<option value="'+n+'" '+(String(x.rating)===String(n)?"selected":"")+'>'+n+' / 5</option>').join("")+'</select><label>メモ</label><textarea id="fNote">'+esc(x.note||"")+'</textarea><div class="actions"><button onclick="saveFood('+i+')">保存</button><button class="danger" onclick="tab=\'food\';render()">キャンセル</button></div></div>';
}
function saveFood(i){const x={date:fDate.value,name:fName.value,dish:fDish.value,amount:Number(fAmount.value||0),rating:fRating.value,note:fNote.value};if(!x.name)return alert("店名を入力してください");if(i>=0)data.food[i]=x;else data.food.push(x);tab="food";save()}
function places(){
  let a=data.places.slice().sort((x,y)=>y.date.localeCompare(x.date));
  if(filter)a=a.filter(x=>(x.name+" "+x.note).toLowerCase().includes(filter.toLowerCase()));
  return '<div class="card"><div class="row between"><div class="hero">📍 場所</div><button onclick="addPlace()">＋追加</button></div>'+searchBox("場所・メモを検索")+'</div>'+(a.length?a.map(x=>'<div class="card"><div class="row between"><div><b>'+esc(x.name)+'</b><div class="muted">'+fmt(x.date)+'</div></div><button class="danger small" onclick="delItem(\'places\','+data.places.indexOf(x)+')">削除</button></div>'+(x.note?'<p>'+esc(x.note)+'</p>':"")+'<button class="small" onclick="window.open(\'https://www.google.com/maps/search/?api=1&query=\'+encodeURIComponent(\''+esc(x.name).replace(/'/g,"")+'\'),\'_blank\')">Google Maps</button></div>').join(""):'<div class="empty">訪れた場所を追加できます。</div>');
}
function addPlace(i=-1){
  const x=i>=0?data.places[i]:{date:today(),name:"",note:""};
  document.getElementById("app").innerHTML='<div class="card form"><div class="hero">📍 '+(i>=0?"場所を編集":"場所を追加")+'</div><label>日付</label><input id="pDate" type="date" value="'+esc(x.date)+'"><label>場所</label><input id="pName" value="'+esc(x.name)+'" placeholder="例：Lanikai Beach"><label>メモ</label><textarea id="pNote">'+esc(x.note||"")+'</textarea><div class="actions"><button onclick="savePlace('+i+')">保存</button><button class="danger" onclick="tab=\'places\';render()">キャンセル</button></div></div>';
}
function savePlace(i){const x={date:pDate.value,name:pName.value,note:pNote.value};if(!x.name)return alert("場所を入力してください");if(i>=0)data.places[i]=x;else data.places.push(x);tab="places";save()}
function money(){
  let a=data.money.slice().sort((x,y)=>y.date.localeCompare(x.date));
  if(filter)a=a.filter(x=>(x.name+" "+x.category+" "+x.note).toLowerCase().includes(filter.toLowerCase()));
  const total=data.money.reduce((s,x)=>s+Number(x.amount||0),0);
  const cats={};data.money.forEach(x=>cats[x.category||"その他"]=(cats[x.category||"その他"]||0)+Number(x.amount||0));
  return '<div class="card"><div class="row between"><div class="hero">💵 支出</div><div class="expense">'+total.toFixed(2)+'</div></div><button onclick="addMoney()">＋支出を追加</button>'+searchBox("内容・カテゴリを検索")+'<div class="catGrid">'+Object.keys(cats).map(k=>'<div class="info"><b>'+esc(k)+'</b><br>'+cats[k].toFixed(2)+'</div>').join("")+'</div></div>'+(a.length?a.map(x=>'<div class="card"><div class="row between"><div><b>'+esc(x.name)+'</b><div class="muted">'+fmt(x.date)+' · '+esc(x.category||"その他")+'</div></div><div><b>'+Number(x.amount||0).toFixed(2)+'</b><br><button class="danger small" onclick="delItem(\'money\','+data.money.indexOf(x)+')">削除</button></div></div>'+(x.note?'<p class="muted">'+esc(x.note)+'</p>':"")+'</div>').join(""):'<div class="empty">支出を追加できます。</div>');
}
function addMoney(i=-1){
  const x=i>=0?data.money[i]:{date:today(),name:"",category:"食事",amount:"",note:""};
  const cats=["食事","交通","ホテル","買い物","観光","その他"];
  document.getElementById("app").innerHTML='<div class="card form"><div class="hero">💵 '+(i>=0?"支出を編集":"支出を追加")+'</div><label>日付</label><input id="mDate" type="date" value="'+esc(x.date)+'"><label>内容</label><input id="mName" value="'+esc(x.name)+'" placeholder="例：Uber"><label>カテゴリ</label><select id="mCat">'+cats.map(c=>'<option '+(x.category===c?"selected":"")+'>'+c+'</option>').join("")+'</select><label>金額（USD）</label><input id="mAmount" type="number" step="0.01" value="'+esc(x.amount||"")+'"><label>メモ</label><textarea id="mNote">'+esc(x.note||"")+'</textarea><div class="actions"><button onclick="saveMoney('+i+')">保存</button><button class="danger" onclick="tab=\'money\';render()">キャンセル</button></div></div>';
}
function saveMoney(i){const x={date:mDate.value,name:mName.value,category:mCat.value,amount:Number(mAmount.value||0),note:mNote.value};if(!x.name||!x.amount)return alert("内容と金額を入力してください");if(i>=0)data.money[i]=x;else data.money.push(x);tab="money";save()}
function schedule(){const a=data.schedule.slice().sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));return '<div class="card"><div class="row between"><div class="hero">📅 予定</div><button onclick="addSchedule()">＋追加</button></div><p class="muted">旅行中の予約・移動・観光予定を時間順に管理できます。</p></div><div class="card">'+[1,2,3,4,5].map(n=>{const d=new Date("2026-10-01T00:00:00");d.setDate(d.getDate()+n-1);const ds=d.toISOString().slice(0,10);const items=a.filter(x=>x.date===ds);return '<div class="entry"><b>DAY '+n+' · '+fmt(ds)+'</b>'+(items.length?items.map(x=>'<div class="info" style="margin-top:8px"><b>'+esc(x.time||"時間未設定")+'　'+esc(x.title)+'</b><div class="muted">'+esc(x.place||"")+'</div>'+(x.note?'<p>'+esc(x.note)+'</p>':"")+'<button class="small" onclick="addSchedule(\''+x.date+'\','+data.schedule.indexOf(x)+')">編集</button> <button class="danger small" onclick="delItem(\'schedule\','+data.schedule.indexOf(x)+')">削除</button></div>').join(""):'<div class="empty">予定なし</div>')+'</div>'}).join("")+'</div>'}function addSchedule(date="",i=-1){const x=i>=0?data.schedule[i]:{date:date||today(),time:"",title:"",place:"",note:""};document.getElementById("app").innerHTML='<div class="card form"><div class="hero">📅 '+(i>=0?"予定を編集":"予定を追加")+'</div><label>日付</label><input id="sDate" type="date" value="'+esc(x.date)+'"><label>時間</label><input id="sTime" type="time" value="'+esc(x.time||"")+'"><label>予定</label><input id="sTitle" value="'+esc(x.title||"")+'"><label>場所</label><input id="sPlace" value="'+esc(x.place||"")+'"><label>メモ</label><textarea id="sNote">'+esc(x.note||"")+'</textarea><div class="actions"><button onclick="saveSchedule('+i+')">保存</button><button class="danger" onclick="tab=\'schedule\';render()">キャンセル</button></div></div>'}function saveSchedule(i){const x={date:sDate.value,time:sTime.value,title:sTitle.value,place:sPlace.value,note:sNote.value};if(!x.title)return alert("予定を入力してください");if(i>=0)data.schedule[i]=x;else data.schedule.push(x);tab="schedule";save()}function info(){
  return '<div class="card"><div class="hero">✈️ 旅行情報</div><div class="grid" style="margin-top:15px"><div class="info"><b>📅 日程</b><br>2026/10/1〜10/5</div><div class="info"><b>👫 人数</b><br>2人</div><div class="info"><b>📍 エリア</b><br>Oahu / Waikiki</div><div class="info"><b>🏨 ホテル</b><br>The Ambassador Hotel of Waikiki</div></div></div><div class="card"><b>🍴 予約メモ</b><p>10/1 Hula Grill — 予約済み</p><p>10/3 ディナー — 記録予定</p></div><div class="card"><div class="hero">💾 データ管理</div><p class="muted">スマホを変えたりブラウザのデータが消えた場合に備えて、旅行中もバックアップできます。</p><div class="actions"><button onclick="exportData()">バックアップ保存</button><button class="small" onclick="document.getElementById(\'importFile\').click()">復元</button><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(this.files[0])"></div></div>';
}
function delItem(type,i){if(confirm("削除しますか？")){data[type].splice(i,1);save()}}
function exportData(){
  const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),data},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="hawaii-diary-backup.json";a.click();URL.revokeObjectURL(a.href);
}
function importData(file){
  if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);data=normalize(x.data||x);save();alert("復元しました。")}catch(e){alert("バックアップの読み込みに失敗しました。")}};r.readAsText(file);
}
document.getElementById("nav").onclick=e=>{const b=e.target.closest("button[data-tab]");if(b){tab=b.dataset.tab;filter="";diaryFilterDate="";render()}};
document.getElementById("fab").onclick=()=>newDiary();
render();
</script>
