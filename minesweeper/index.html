<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Minesweeper</title><style>body{margin:0;background:#111827;color:white;font-family:system-ui;text-align:center}main{max-width:460px;margin:auto;padding:18px}#b{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;background:#030712;padding:4px;border-radius:12px}.c{aspect-ratio:1;border:0;border-radius:5px;background:#64748b;font-size:22px;font-weight:800}.o{background:#e5e7eb}.f{background:#475569}button#new{margin-top:14px;width:100%;padding:13px;border:0;border-radius:12px;font-weight:800;background:#f59e0b}</style><main><h1>💣 Minesweeper</h1><p>9×9 / 10 mines　⏱ <b id=t>0</b>　🚩 <b id=m>10</b></p><div id=b></div><button id=new>🔄 新しいゲーム</button><p>タップ：開く　長押し：旗</p></main><script>
const S=81,M=10;let a,F,over,time,tm,down;
const n=i=>{let r=i/9|0,c=i%9,x=[];for(let y=-1;y<2;y++)for(let z=-1;z<2;z++){let R=r+y,C=c+z;if((y||z)&&R>=0&&R<9&&C>=0&&C<9)x.push(R*9+C)}return x};
function game(){clearInterval(tm);time=0;over=0;F=new Set;a=Array.from({length:S},()=>({m:0,o:0,n:0}));let p=[...Array(S).keys()];p.sort(()=>Math.random()-.5);p.slice(0,M).forEach(i=>a[i].m=1);a.forEach((x,i)=>x.n=n(i).filter(j=>a[j].m).length);draw()}
function start(){if(tm)return;tm=setInterval(()=>t.textContent=++time,1000)}
function open(i){if(over||a[i].o||F.has(i))return;start();a[i].o=1;if(a[i].m){over=1;clearInterval(tm);a.forEach(x=>x.m&&(x.o=1));draw();setTimeout(()=>alert('💥 GAME OVER'),80);return}if(!a[i].n)n(i).forEach(open);draw();if(a.every(x=>x.m||x.o)){over=1;clearInterval(tm);setTimeout(()=>alert('🎉 CLEAR! '+time+'秒'),80)}}
function flag(i){if(over||a[i].o)return;start();F.has(i)?F.delete(i):F.size<M&&F.add(i);draw()}
function draw(){b.innerHTML='';a.forEach((x,i)=>{let e=document.createElement('button');e.className='c '+(x.o?'o':'')+(F.has(i)?' f':'');e.textContent=x.o?(x.m?'💣':x.n||''):F.has(i)?'🚩':'';let col={1:'#2563eb',2:'#16a34a',3:'#dc2626',4:'#7c3aed'}[x.n];if(col)e.style.color=col;e.onpointerdown=()=>{down=setTimeout(()=>{down=null;flag(i)},420)};e.onpointerup=()=>{if(down){clearTimeout(down);down=null;open(i)}};e.oncontextmenu=q=>{q.preventDefault();flag(i)};b.append(e)});m.textContent=M-F.size;t.textContent=time}
new.onclick=game;game();document.ondblclick=e=>e.preventDefault();
</script>
